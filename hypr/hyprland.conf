# -----------------------------------------------------
# Screenshots
# -----------------------------------------------------
# Region crop (Print or Super+Shift+S)
bind = , Print, exec, ~/.config/quickshell/scripts/screenshot.sh area
bind = SUPER_SHIFT, S, exec, ~/.config/quickshell/scripts/screenshot.sh area

# Active Window
bind = CTRL, Print, exec, ~/.config/quickshell/scripts/screenshot.sh window

# Fullscreen
bind = SHIFT, Print, exec, ~/.config/quickshell/scripts/screenshot.sh screen
