# hypridle — "Lacia After Dark" idle wind-down
#
# 9 min   soft dim
# 10 min  lock  (Quickshell lock screen, PAM auth)
# 11 min  display off
# sleep   lock before suspend, restore display on wake
#
# Idle is purely input-driven: both inhibitor classes are ignored.
#
# Wayland: Hyprland's IdleNotify.cpp never sends `idled` while any
# zwp_idle_inhibitor_v1 is held, and Vesktop/Discord holds one for as long as it
# is open — which silently disabled every idle listener here.
#
# D-Bus: Vesktop also flaps a "Video Wake Lock" ScreenSaver inhibit on and off
# roughly once a second. hypridle only consults the inhibit count at the moment
# `idled` fires and never retries, so obeying it made locking a coin flip.
#
# Consequence: a playing video no longer keeps the screen awake. Add a
# `condition_cmd` to the listeners below if that becomes annoying.

general {
    lock_cmd = qs ipc call lockscreen lock
    before_sleep_cmd = qs ipc call lockscreen lock
    after_sleep_cmd = $HOME/.config/hypr/scripts/dpms.sh on

    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
}

listener {
    timeout = 540
    on-timeout = $HOME/.config/hypr/scripts/idle-brightness.sh dim
    on-resume  = $HOME/.config/hypr/scripts/idle-brightness.sh restore
}

listener {
    timeout = 600
    on-timeout = qs ipc call lockscreen lock
}

listener {
    timeout = 660
    on-timeout = $HOME/.config/hypr/scripts/dpms.sh off
    on-resume  = $HOME/.config/hypr/scripts/dpms.sh on
}